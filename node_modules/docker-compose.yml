# ── docker-compose.yml — Lacrei DevOps Challenge ────────────────────────────

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: lacrei-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - APP_VERSION=${APP_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - lacrei-net

networks:
  lacrei-net:
    driver: bridge